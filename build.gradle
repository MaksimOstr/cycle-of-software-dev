plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'ShopSphere - online store (modular monolith)'

// Versions of the libraries that are not managed by the Spring Boot BOM are kept in one place.
// All Spring, Jackson, validation and test libraries get their versions from the BOM of Spring Boot 4.1.1,
// so they are always compatible with each other.
ext {
    springdocVersion = '3.1.1'
    jacocoVersion = '0.8.15'
    // Liquibase and springdoc ask for different versions of commons-text: the newer one is used for both
    commonsTextVersion = '1.15.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Production code stays in /src (src/main/java), tests are kept in the top-level /tests folder
// as required by the repository structure of the project.
sourceSets {
    test {
        java {
            srcDirs = ['tests/java']
        }
        resources {
            srcDirs = ['tests/resources']
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // health check and metrics endpoints (NFR "Logging and monitoring")
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // OpenAPI 3 description of the REST API and Swagger UI (NFR "API documentation")
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    // PostgreSQL: Spring Data JPA (Hibernate) for the repositories, Liquibase for the schema migrations
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // integration tests start a real PostgreSQL in Docker
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Fail the build if two libraries ask for different versions of the same dependency and Gradle
// would have to pick one silently.
configurations.configureEach {
    if (name in ['compileClasspath', 'runtimeClasspath']) {
        resolutionStrategy.failOnVersionConflict()
        resolutionStrategy.force "org.apache.commons:commons-text:${commonsTextVersion}"
    }
}

jacoco {
    toolVersion = jacocoVersion
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

// Coverage report: build/reports/jacoco/test/html/index.html (NFR "Test coverage 70%")
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
