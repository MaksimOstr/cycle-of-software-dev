name: CI

# Every change is built and tested before it gets into master (NFR "CI and code review")
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # compiles, runs all tests (PostgreSQL is started by Testcontainers in Docker of the runner)
      # and checks that the test coverage is at least 70%
      - name: Build
        run: ./gradlew build

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      # builds the image and starts the application together with its database;
      # --wait succeeds only when the health checks of all containers pass
      - name: Start the system with Docker Compose
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Check the health endpoint and the catalog
        run: |
          curl --fail --silent http://localhost:8080/actuator/health | grep '"status":"UP"'
          curl --fail --silent "http://localhost:8080/api/v1/products?query=hoodie" | grep 'Basic Hoodie'

      - name: Show the logs if something failed
        if: failure()
        run: docker compose logs
