name: CI

# Every change is built and tested before it gets into master (NFR "CI and code review")
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # compiles, runs all tests and checks that the test coverage is at least 70%
      - name: Build
        run: ./gradlew build

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t shopsphere:ci .

      - name: Start the container and wait for the health check
        run: |
          docker run -d --name shopsphere -p 8080:8080 shopsphere:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "The application is up"
              exit 0
            fi
            sleep 2
          done
          docker logs shopsphere
          exit 1
