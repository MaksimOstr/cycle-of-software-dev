spring.application.name=shopsphere

# Load demo users, catalog and stock into the in-memory storage at startup
shopsphere.demo-data.enabled=true
# How often unpaid card orders are checked (they are cancelled 30 minutes after creation)
shopsphere.ordering.unpaid-check-interval=PT1M

# Monitoring: only the health check and build information are exposed
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI 3 description: /v3/api-docs, Swagger UI: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**

# Finish the requests that are already being processed before the application stops
server.shutdown=graceful
