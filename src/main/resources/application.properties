spring.application.name=shopsphere

# Load demo users, catalog and stock into the in-memory storage at startup
shopsphere.demo-data.enabled=true
# How often unpaid card orders are checked (they are cancelled 30 minutes after creation)
shopsphere.ordering.unpaid-check-interval=PT1M

# Monitoring: only the health check and build information are exposed
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI 3 description: /v3/api-docs, Swagger UI: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**

# Finish the requests that are already being processed before the application stops
server.shutdown=graceful

# PostgreSQL. The defaults match docker-compose.yml; other environments set the SHOPSPHERE_DB_* variables
spring.datasource.url=${SHOPSPHERE_DB_URL:jdbc:postgresql://localhost:5432/shopsphere}
spring.datasource.username=${SHOPSPHERE_DB_USER:shopsphere}
spring.datasource.password=${SHOPSPHERE_DB_PASSWORD:shopsphere}

# The schema is created only by the Liquibase changelog (db/changelog); Hibernate checks that the entities match it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
# A database connection is used only inside a transaction of a service, not for the whole HTTP request
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
